<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>跃动的爱心</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #1a1a1a; /* 暗色背景，让爱心更突出 */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="heartCanvas"></canvas>

    <script>
        const canvas = document.getElementById('heartCanvas');
        const ctx = canvas.getContext('2d');

        // 让画布铺满整个窗口
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        let frame = 0;

        // 核心动画循环
        function animate() {
            // 清空上一帧
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // 计算缩放比例（和你 Python 里的逻辑一样）
            // 0.08 是跳动幅度，5 是跳动速度
            const scale = 1 + 0.08 * Math.sin(frame / 5);
            
            // 设置画布中心点
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;

            // 开始绘制爱心
            ctx.beginPath();
            
            // 1000个点勾勒爱心轮廓
            for (let i = 0; i <= 1000; i++) {
                const t = (i / 1000) * Math.PI * 2;
                
                // 参数方程
                const x = 16 * Math.pow(Math.sin(t), 3);
                const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
                
                // 将数学坐标映射到屏幕坐标，并乘以缩放比例
                // 注意：屏幕的 Y 轴是向下的，所以要用 centerY 减去 y
                const screenX = centerX + x * 15 * scale;
                const screenY = centerY - y * 15 * scale;

                if (i === 0) {
                    ctx.moveTo(screenX, screenY);
                } else {
                    ctx.lineTo(screenX, screenY);
                }
            }
            
            // 闭合路径
            ctx.closePath();

            // 绘制填充颜色（半透明红色）
            ctx.fillStyle = 'rgba(255, 45, 85, 0.4)';
            ctx.fill();

            // 绘制描边（亮红色）
            ctx.strokeStyle = '#ff2d55';
            ctx.lineWidth = 3;
            ctx.stroke();

            // 添加发光效果（阴影）
            ctx.shadowColor = '#ff2d55';
            ctx.shadowBlur = 20;

            frame++;
            requestAnimationFrame(animate);
        }

        // 启动动画
        animate();
    </script>
</body>
</html>
